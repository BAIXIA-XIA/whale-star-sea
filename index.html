<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鲸落星海</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
<div id="game">
  <!-- 背景层 -->
  <div id="bg-layer"></div>
  <!-- 立绘层 -->
  <div id="char-layer"></div>
  <!-- 顶栏：场景名 + 好感度 -->
  <div id="top-bar">
    <span id="scene-name">第一幕 · 街角相识</span>
    <span id="affection">❤ 好感度：0</span>
  </div>
  <!-- 对话框 -->
  <div id="dialogue-box">
    <span id="speaker"></span>
    <div id="dialogue"></div>
  </div>
  <!-- 选项区 -->
  <div id="choices"></div>
  <!-- 开始界面 -->
  <div id="start-screen">
    <h1>鲸落星海</h1>
    <p>——与来自数据海的少女们相遇——</p>
    <button id="start-btn" onclick="playScene1()">开始游戏</button>
  </div>
</div>
<!-- BGM引擎（WebAudio合成，零素材） -->
<script src="bgm.js"></script>
<!-- 剧本（acts/：每幕一文件，可无限扩充） -->
<script src="acts/act1.js"></script>
<script src="acts/act2.js"></script>
<script src="acts/act3.js"></script>
<script src="acts/act4.js"></script>
<!-- 游戏逻辑 -->
<script src="game.js"></script>
</body>
</html>
